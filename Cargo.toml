[workspace]
members  = ["crates/rust-proxmoxmcp-core", "crates/rust-proxmoxmcp"]
resolver = "2"

[workspace.package]
version      = "0.11.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT"
repository   = "https://github.com/mechubsec/rustproxmoxmcp"
authors      = ["fastrevmd-lab"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code  = "forbid"

[workspace.lints.clippy]
all         = { level = "warn", priority = -1 }
dbg_macro   = "deny"
todo        = "deny"
unwrap_used = "warn"

[workspace.dependencies]
anyhow      = "1"
async-trait = "0.1"
axum        = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
chrono      = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap        = { version = "4", features = ["derive"] }
getrandom   = "0.4"
http        = "1"
rmcp        = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
rustls      = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
schemars    = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.11"
thiserror   = "2"
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util  = { version = "0.7", default-features = false, features = ["rt"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url         = "2"
uuid        = { version = "1", features = ["v4"] }

# Test-only
rcgen        = "0.14"
tokio-rustls = "0.26"

# Internal workspace crate. This version must be bumped alongside
# [workspace.package] version on each release.
rust-proxmoxmcp-core = { path = "crates/rust-proxmoxmcp-core", version = "0.11.1" }

# mecmcp is consumed read-only at an exact pinned version. Do not relax the tag.
mecmcp-audit     = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0" }
mecmcp-auth      = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0" }
mecmcp-changeset = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0" }
# "absolute-url": with_base_and_path (the non-feature-gated constructor) has
# no way to attach a query string to the request it builds, and
# get_json/delete_json in rust-proxmoxmcp-core need one (?purge=, etc). The
# URL is still assembled from a validated mecmcp_openapi::ExpandedPath plus
# an operator-configured endpoint and locally percent-encoded query values,
# the same inputs the pre-v0.25.0 HttpRequest::new call validated -- no new
# untrusted data reaches this constructor. See client.rs.
mecmcp-http      = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0", features = ["absolute-url"] }
mecmcp-inventory = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0" }
mecmcp-job       = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0" }
mecmcp-openapi   = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0" }
mecmcp-runtime   = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0" }
mecmcp-secret    = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0" }
mecmcp-server    = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0" }
mecmcp-transport = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0" }
mecmcp-redact    = { version = "0.26.0", git = "https://github.com/mechubsec/mecmcp", tag = "v0.26.0" }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
