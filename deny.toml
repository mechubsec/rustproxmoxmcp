[advisories]
version = 2
yanked  = "deny"
ignore = [
    # chrono is unmaintained (no fix exists). It is required non-optionally by rmcp, oauth2 and mecmcp; revisit when rmcp drops it.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by rmcp/oauth2, no maintained replacement upstream" },
]

[licenses]
version = 2
allow   = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # webpki-root-certs, reached transitively through rustls-platform-verifier ->
    # reqwest. Covers the embedded Mozilla root cert data, not code. Same
    # allowance as mecmcp and rustjunosmcp.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared mecmcp crate family, consumed as a tag-pinned git dependency until
# the interfaces stabilise enough to publish. `unknown-git = "deny"` above still
# rejects every other git source, so this is one named exception rather than a
# blanket allowance. Remove it once mecmcp-auth is on crates.io.
allow-git = ["https://github.com/mechubsec/mecmcp"]
