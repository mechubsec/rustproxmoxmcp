[package]
name         = "rust-proxmoxmcp"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description  = "One MCP server for many Proxmox VE clusters."

[[bin]]
name = "rust-proxmoxmcp"
path = "src/main.rs"

[dependencies]
anyhow           = { workspace = true }
axum             = { workspace = true }
axum-server      = { workspace = true }
clap             = { workspace = true }
getrandom        = { workspace = true }
http             = { workspace = true }
mecmcp-audit     = { workspace = true }
mecmcp-auth      = { workspace = true }
mecmcp-changeset = { workspace = true }
mecmcp-job       = { workspace = true }
mecmcp-redact    = { workspace = true }
mecmcp-runtime   = { workspace = true }
mecmcp-secret    = { workspace = true }
mecmcp-server    = { workspace = true }
mecmcp-transport = { workspace = true }
rmcp             = { workspace = true }
rust-proxmoxmcp-core = { workspace = true }
rustls           = { workspace = true }
schemars         = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
tokio            = { workspace = true }
tokio-util       = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# `write_state_for_test` is behind this feature. Needed so a test can persist a
# change-set state the current coordinator refuses to create -- specifically a
# record an older binary approved before previews were bound to the approval
# digest. Dev-only, so a release build never enables it.
mecmcp-changeset = { workspace = true, features = ["test-util"] }
mecmcp-auth      = { workspace = true }
# Test-only: the shared tool-output-redaction coverage helper
# (`testing::tools_leaking_secrets`), gated the same way mecmcp-changeset's
# `write_state_for_test` is -- dev-only, so a release build never links it.
mecmcp-redact    = { workspace = true, features = ["test-util"] }
# Test-only: the test harness uses mecmcp_transport::test_harness::serve_on_loopback
# and mecmcp_transport::test_client::McpClient. mecmcp 0.24.0 (#387) moved both
# behind this feature and dropped their `ureq` dependency from the normal
# (non-test-util) dependency graph.
mecmcp-transport = { workspace = true, features = ["test-util"] }
reqwest          = { version = "0.13", features = ["json"] }
rust-proxmoxmcp-core = { workspace = true, features = ["testing"] }
serde_json       = { workspace = true }
tempfile         = "3"
tokio            = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid             = { workspace = true }

[lints]
workspace = true
