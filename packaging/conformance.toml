binary     = "bin/rust-proxmoxmcp"
installer  = "packaging/lxc/install.sh"
service    = "rust-proxmoxmcp"
config_dir = "/etc/proxmoxmcp"
tokens     = "/var/lib/proxmoxmcp/tokens.json"

# No supported skip-build path yet, so no honest BUILD-INFO is possible.
# R3 warns until both change together. See mecmcp's spec, "Provenance ordering".
build_info     = false
skip_build_env = false

units = ["packaging/systemd/rust-proxmoxmcp.service"]

# ENTRYPOINT holds the config and credential paths; these must survive any
# operator override. Fixed in #85, guarded centrally from here.
#
# --audit-hmac-key-file closes the "5 of 6 server images run unkeyed audit"
# gap (mecmcp#376 / MEC-978): without it in ENTRYPOINT, any operator override
# would silently drop audit keying the same way #85 described for the config
# and token paths.
must_survive_override = ["--clusters-file", "--tokens-file", "--audit-hmac-key-file"]

# The binary generates its own key when the file is absent and the image has
# no shell to run a key-generating entrypoint script, so this declares the
# audit_hmac_flag pattern instead of audit_entrypoint. Promotes conformance
# R7 from warn to fatal: the flag above is already in must_survive_override,
# so R6 proves it reaches the running container's argv.
audit_hmac_flag = "--audit-hmac-key-file"
