name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build excludes the dev-only testing feature
        run: |
          set -euo pipefail
          tree="$(cargo tree --package rust-proxmoxmcp --no-default-features --edges normal --locked)"
          if [ -z "$tree" ]; then
            echo "ERROR: cargo tree produced no output; the guard cannot verify anything" >&2
            exit 1
          fi
          if printf '%s' "$tree" | grep -q rcgen; then
            echo "ERROR: rcgen present in the release tree — the testing feature leaked in" >&2
            exit 1
          fi
          echo "OK: testing feature excluded from the release build"

  docker-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: rust-proxmoxmcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Argv-survival regression guard
        run: |
          # Regression guard for mecmcp#357: config paths must survive operator overrides.
          # Docker replaces CMD entirely when the caller supplies args, but appends to
          # ENTRYPOINT, so config paths must live in ENTRYPOINT or they vanish the
          # moment anyone passes --host.
          container_id=$(docker create rust-proxmoxmcp:ci --host 0.0.0.0)
          argv=$(docker inspect "$container_id" --format '{{join .Args "\n"}}')
          docker rm "$container_id" > /dev/null
          echo "$argv" | grep -q -- '/etc/proxmoxmcp/clusters.json' || { echo "FAIL: --clusters-file path missing from argv with --host override"; exit 1; }
          echo "$argv" | grep -q -- '/var/lib/proxmoxmcp/tokens.json' || { echo "FAIL: --tokens-file path missing from argv with --host override"; exit 1; }
          echo "PASS: config paths survive --host override"

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the working toolchain (1.98.0); the MSRV
      # floor declared in Cargo.toml's rust-version is deliberately lower.
      # Remove the pin so the 1.89 toolchain below is what actually runs.
      - name: Drop the toolchain pin
        run: rm -f rust-toolchain.toml

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.89.0

      # Cargo.lock is committed for the other jobs, but this one deletes it and
      # resolves fresh so it takes whatever the registry currently offers. That
      # is what makes it useful — it catches a dependency raising its floor —
      # and also what lets an unrelated release turn every open PR red with no
      # commit behind it. If a future dependency raises its floor above ours,
      # pin it with `cargo update -p <crate> --precise <version>` instead of
      # silently raising the workspace floor, because the floor is a promise
      # operators building from source depend on.
      - name: Drop the committed lockfile
        run: rm -f Cargo.lock

      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets

  conformance:
    name: Package conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the release binary
        run: cargo build --release --locked --bin rust-proxmoxmcp

      - name: Stage the package
        run: |
          set -euo pipefail
          mkdir -p staging/bin
          cp target/release/rust-proxmoxmcp staging/bin/
          cp -r packaging staging/packaging
          cp packaging/conformance.toml staging/

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: rust-proxmoxmcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Conformance
        uses: mechubsec/mecmcp/packaging/conformance@373dc51cac90b97e728e20363b4b05d7b2c179a5
        with:
          staging: staging
          manifest: staging/conformance.toml
          image: rust-proxmoxmcp:ci
