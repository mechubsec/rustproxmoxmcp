name: security

# Secret scan + Rust supply-chain checks. Actions pinned to commit SHAs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan: the shared mechubsec workflow (pinned gitleaks binary; no
  # license needed, unlike gitleaks-action on org repos).
  secrets:
    uses: mechubsec/.github/.github/workflows/gitleaks.yml@1f46f69afab3cc1c77efa196747bc3a5e45a3755
    with:
      full-history: true

  cargo:
    name: cargo-audit + cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Ensure Cargo.lock exists
        run: test -f Cargo.lock || cargo generate-lockfile

      # Installed directly rather than via cargo-deny-action, which builds its
      # own image and so depends on Docker Hub at run time. That dependency has
      # now failed this job for real: three retries of
      # "dial tcp ...:443: i/o timeout" pulling rust:1.85.0-alpine3.20, with
      # nothing wrong in the repo. A supply-chain gate that goes red on an
      # unrelated registry outage is a gate people learn to ignore, which is
      # worse than not having it. Slower, but it depends only on crates.io,
      # which this job already needs. Matches mecmcp and rustpanosmcp.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo-audit (RUSTSEC advisories)
        run: cargo audit

      - name: cargo-deny (advisories + licenses + bans + sources)
        run: cargo deny check advisories licenses bans sources
