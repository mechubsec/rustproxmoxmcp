name: Release image

# Build and publish the rust-proxmoxmcp image to GHCR on every version tag (v1.2.3).
# All actions here are pinned to commit SHAs, not floating tags, because this
# workflow pushes to a registry and signs the result.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the image, e.g. v0.3.0 (-> tags 0.3.0, 0.3, latest)'
        required: true
      ref:
        description: 'Git ref/commit to build (default: the branch this workflow runs from, usually main). Use this to backfill a release whose own tagged tree predates a Dockerfile fix.'
        required: false
        default: ''

jobs:
  release:
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing exchanges this job's OIDC token for a
      # short-lived Fulcio certificate; no key material is stored anywhere.
      # A reusable workflow's permissions can only be narrowed by the
      # caller, never widened, so this job must grant them itself -- see
      # mecmcp's docs/RELEASE-WORKFLOWS.md.
      id-token: write
    uses: mechubsec/mecmcp/.github/workflows/reusable-release-image.yml@8557155ed1ecd24e7ae25948d70485f0fc8c8451 # v0.30.1
    with:
      # GHCR requires a lowercase image path; github.repository is already lowercase.
      image: ghcr.io/${{ github.repository }}
      # Dual-push (mecmcp MEC-2110): same tags on Docker Hub. The org is `mechub`
      # there; `mechubsec` does not exist on Docker Hub.
      dockerhub-image: docker.io/mechub/rustproxmoxmcp
      description: 'Proxmox VE MCP server'
      version: ${{ github.event.inputs.version }}
      ref: ${{ github.event.inputs.ref }}
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  tag-version:
    name: Resolve tag version
    # reusable-registry-publish.yml re-verifies the pushed tag's signature
    # itself and has no workflow_dispatch story, so this job (and the
    # registry-publish job below) only runs for the tag-push trigger.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading v from the pushed tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  registry-publish:
    name: Publish to MCP Registry
    if: github.event_name == 'push'
    needs: [release, tag-version]
    permissions:
      contents: read
      id-token: write
    uses: mechubsec/mecmcp/.github/workflows/reusable-registry-publish.yml@8557155ed1ecd24e7ae25948d70485f0fc8c8451 # v0.30.1
    with:
      version: ${{ needs.tag-version.outputs.version }}
      oci-image: ghcr.io/${{ github.repository }}:${{ needs.tag-version.outputs.version }}
