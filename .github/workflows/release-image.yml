name: Release image

# Build and publish the rust-proxmoxmcp image to GHCR on every version tag (v1.2.3).
# All actions here are pinned to commit SHAs, not floating tags, because this
# workflow pushes to a registry and signs the result.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the image, e.g. v0.3.0 (-> tags 0.3.0, 0.3, latest)'
        required: true
      ref:
        description: 'Git ref/commit to build (default: the branch this workflow runs from, usually main). Use this to backfill a release whose own tagged tree predates a Dockerfile fix.'
        required: false
        default: ''

env:
  # GHCR requires a lowercase image path; github.repository is already lowercase.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      # One .cdx.json per workspace member; the binary's
      # (rust-proxmoxmcp.cdx.json) is the one that matches what actually
      # ships in the image.
      - name: Generate SBOM
        run: cargo cyclonedx --all --format json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: '**/*.cdx.json'
          retention-days: 90

  build-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing exchanges this job's OIDC token for a
      # short-lived Fulcio certificate; no key material is stored anywhere.
      # This workflow only ever runs from a version-tag push or an explicit
      # workflow_dispatch backfill of an already-tagged release (see the
      # `ref` input above) — never from a PR or an untagged branch push — so
      # a Rekor transparency-log entry is only ever created for a
      # board-approved release.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build source: an explicit ref if given, else the dispatched branch
          # (main) on manual runs, or the pushed tag on tag-triggered runs.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # v0.3.0 -> tags 0.3.0, 0.3, latest. The `value=` override makes the
          # manual workflow_dispatch path derive the version from the input;
          # on a tag push the input is empty and metadata falls back to the ref.
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.version }}
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        # Sign by digest, not by the mutable tags above -- a tag can be
        # repointed later, but the digest is what was actually just pushed.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
